<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login & Signup</title>
    <link rel="stylesheet" href="style1.css">
</head>

<body>

    <div class="container">
        <div class="box">
            <h1 id="title">Login</h1>

            <p class="subtitle" id="subtitle">Welcome back! Please login to continue.</p>

            <form id="authForm">

                <div class="input-group" id="nameField">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name" autocomplete="name" required>
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <input type="password" id="password" placeholder="Enter your password" minlength="6"
                        autocomplete="current-password" required>

                    <button type="button" id="toglePassword">Show</button>
                </div>

                  <div class="input-group" id="confirmPasswordField">
                    <label for="confirmPassword">Confirm Password</label>

                    <input type="password" id="confirmPassword" placeholder="Confirm your password" minlength="6"autocomplete="new-password"></div>

                <div class="input-group" id="ageField">
                    <label>Are you 18 or older?</label>

                    <label>
                        <input type="radio" name="gender" value="yes">Yes</label>

                    <label>
                        <input type="radio" name="gender" value="no">No</label>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Login</button>

            </form>

            <p class="switch-text">

                <button type="button" id="switchBtn">Sign Up</button>
            </p>

            <p id="error" style="color: red;"></p>

        </div>
    </div>

    <script src="login_signup.js"></script>

</body>

</html>
